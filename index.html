<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriVision Scanner AI</title>
    <!-- FIXED: Full, working CDN scripts for TensorFlow and Teachable Machine libraries -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        #webcam-container { margin: 20px auto; border-radius: 15px; overflow: hidden; width: 300px; height: 300px; border: 4px solid #333; display: flex; justify-content: center; align-items: center; }
        #webcam-container canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
        .btn { background: #00b4d8; border: none; padding: 15px 30px; font-size: 16px; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        #status { margin-top: 20px; font-size: 20px; font-weight: bold; color: #00b4d8; }
    </style>
</head>
<body>
    <h1>AgriVision AI Scanner</h1>
    <p>Point phone or webcam at leaf to scan</p>
    <button class="btn" onclick="init()">Start Scanner</button>
    <div id="webcam-container"></div>
    <div id="status">Status: Offline</div>

    <script>
        // --- CONFIGURATION ---
        // 1. Paste your exported link from Teachable Machine here (Keep the trailing slash)
        const MODEL_URL = "YOUR_TEACHABLE_MACHINE_URL_HERE"; 
        
        // 2. FIXED: Your exact M5StickC Plus2 IPv4 network address is hardcoded here
        const M5STICK_IP = "10.165.74.7"; 
        // ---------------------

        let model, webcam, maxPredictions;
        let lastSentState = "";

        async function init() {
            document.getElementById("status").innerText = "Loading AI Model...";
            try {
                model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
                maxPredictions = model.getTotalClasses();

                // Setup camera configuration
                const flip = false; 
                webcam = new tmImage.Webcam(300, 300, flip);
                
                // Triggers environmental camera on phones, falls back to laptop webcam on Mac
                await webcam.setup({ facingMode: "environment" }); 
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").innerHTML = ""; // Clear loader text
                document.getElementById("webcam-container").appendChild(webcam.canvas);
                document.getElementById("status").innerText = "Scanning Active...";
            } catch (error) {
                console.error("Initialization error:", error);
                document.getElementById("status").innerText = "Camera or Model Error! Check console panel.";
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            let highestPrediction = { className: "", probability: 0 };

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestPrediction.probability) {
                    highestPrediction = prediction[i];
                }
            }

            // Fire request if confidence crosses the 85% threshold
            if (highestPrediction.probability > 0.85) {
                let currentState = highestPrediction.className;
                document.getElementById("status").innerText = `Detected: ${currentState} (${(highestPrediction.probability*100).toFixed(0)}%)`;
                
                // Single execution check to avoid spamming network requests
                if (currentState !== lastSentState) {
                    lastSentState = currentState;
                    sendToM5Stick(currentState.toLowerCase());
                }
            }
        }

        function sendToM5Stick(endpoint) {
            console.log(`Sending command packet to: http://${M5STICK_IP}/${endpoint}`);
            // Mode 'no-cors' allows local server ping without security restriction blocks
            fetch(`http://${M5STICK_IP}/${endpoint}`, { mode: 'no-cors' })
                .then(() => console.log(`Signal successfully reached /${endpoint}`))
                .catch(err => console.error("Network routing error targeting M5Stick", err));
        }
    </script>
</body>
</html>
